name: nab_guard
description: Nab (Nezm Afarinan Bidar), an offline-first guard patrol application.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  http: ^1.4.0
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  mobile_scanner: ^7.1.2
  image_picker: ^1.2.0
  workmanager: ^0.10.10
  connectivity_plus: ^7.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
