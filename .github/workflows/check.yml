name: Check Nab
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nab_test
          POSTGRES_USER: nab_test
          POSTGRES_PASSWORD: nab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nab_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NAB_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/nab_test
      NAB_TEST_DB_USER: nab_test
      NAB_TEST_DB_PASSWORD: nab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B verify
        working-directory: backend
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: web
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: mobile
