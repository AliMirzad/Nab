server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/nab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
nab:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  admin-password: ${ADMIN_PASSWORD:}
  demo: ${DEMO_MODE:false}
  upload-dir: ${UPLOAD_DIR:./data/photos}
  session-days: 30
