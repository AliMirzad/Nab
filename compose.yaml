services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nab
      POSTGRES_USER: nab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nab"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/nab
      DB_USER: nab
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DEMO_MODE: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8088}
    volumes:
      - photos:/app/data/photos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./web
    ports: ["${WEB_PORT:-8088}:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
  photos:
